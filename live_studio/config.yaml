name: Live Studio Engine
version: "0.5.1"
slug: live_studio
url: https://github.com/tuxevil/home-assistant/tree/main/live_studio
description: Local RTSP streaming studio with music, text overlays and a Home Assistant control API
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
video: true
map:
  - type: share
    read_only: true
  - type: media
    read_only: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional local control API; prefer the internal app hostname
options:
  api_token: ""
  destination_url: ""
schema:
  api_token: password
  destination_url: password
